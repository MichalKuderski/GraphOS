[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphos-control"
version = "0.1.0"
description = "Evidence-controlled agent execution and verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[project.scripts]
graphos = "graphos.__main__:main"

[tool.setuptools.packages.find]
include = ["graphos*"]

[tool.setuptools.package-data]
graphos = ["migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "sandbox: requires Docker verifier image"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
